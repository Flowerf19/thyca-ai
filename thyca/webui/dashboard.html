<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#714327" />
    <title>Thyca — Dashboard</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./shared/css/tokens.css" />
    <link rel="stylesheet" href="./shared/css/kit.css" />
    <link rel="stylesheet" href="./shared/css/states.css" />
    <link rel="stylesheet" href="./shared/css/markdown.css" />
    <link rel="stylesheet" href="./shared/css/bot-avatar.css" />
    <link rel="stylesheet" href="./pages/dashboard/cost.css" />
    <link rel="stylesheet" href="./pages/dashboard/usage.css" />
    <link rel="stylesheet" href="./pages/dashboard/dashboard.css" />
    <link rel="stylesheet" href="./pages/dashboard/overview.css" />
    <link rel="stylesheet" href="./pages/dashboard/trace.css" />
  </head>
  <body>
    <main class="notebook-shell screen-shell dashboard-shell pick-shell is-picking" aria-label="Dashboard Thyca">
      <header class="site-header">
        <button class="icon-button menu-button" type="button" aria-label="Mở mục lục">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h11" /></svg>
        </button>
        <p class="header-line">
          <time id="header-datetime" datetime=""></time>
          <span id="header-edition">Thyca</span>
        </p>
      </header>
      <aside class="sidebar" aria-label="Điều hướng">
        <section class="sessions">
          <div class="sessions-heading">
            <h2>Dashboard</h2>
          </div>
          <nav class="session-list" id="overview-nav" aria-label="Chọn Chung, bot hoặc group bot"></nav>
        </section>
      </aside>
      <section class="workspace" aria-label="Bảng tổng quan">
        <section class="screen-surface dashboard-surface" aria-label="Chi phí và sử dụng">
          <section class="dashboard-block dashboard-section" id="overview" aria-labelledby="overview-heading">
            <header class="screen-heading">
              <div class="screen-title"><h1 id="overview-heading">Tổng quan</h1></div>
            </header>
            <div class="headrow">
              <label class="cost-period">
                <select class="screen-select" id="overview-period" aria-label="Khoảng thời gian">
                  <option value="30">30 ngày qua</option>
                  <option value="7">7 ngày qua</option>
                  <option value="1">Hôm nay</option>
                </select>
              </label>
              <p class="screen-status" id="overview-range" aria-live="polite"></p>
            </div>
            <div id="overview-content" aria-live="polite"></div>
            <p class="screen-status" id="overview-status" role="status" aria-live="polite"></p>
          </section>

          <section class="dashboard-block" id="trace" aria-labelledby="trace-heading" hidden>
            <header class="screen-heading">
              <button class="screen-back" type="button">‹ Dashboard</button>
              <div class="screen-title"><h1 id="trace-heading">Trace</h1></div>
              <label class="cost-period">
                <select class="screen-select" id="trace-period" aria-label="Khoảng thời gian">
                  <option value="30">30 ngày qua</option>
                  <option value="7">7 ngày qua</option>
                  <option value="1">Hôm nay</option>
                  <option value="all">200 phiên mới nhất</option>
                </select>
              </label>
              <button class="screen-button" id="trace-back" type="button" hidden>‹ Phiên</button>
            </header>
            <p class="screen-status" id="trace-status" role="status" aria-live="polite"></p>
            <p class="screen-status trace-note" id="trace-note" hidden></p>
            <section id="trace-picker" aria-label="Phiên trò chuyện">
              <h2 class="cost-model-heading">Phiên</h2>
              <div class="screen-filter-row" id="trace-bot-filters" role="group" aria-label="Lọc phiên theo bot"></div>
              <ul class="journal" id="trace-sessions"></ul>
            </section>
            <section id="trace-session" hidden aria-label="Nhật ký thực thi của phiên">
              <div class="trace-meta">
                <h2 class="cost-model-heading" id="trace-session-title">Phiên</h2>
                <button class="screen-button" id="copy-id" type="button" disabled>
                  <span id="copy-label">ID: —</span>
                  <svg class="screen-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="13" rx="1.5" /><path d="M6 16H5a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 5 2h9A1.5 1.5 0 0 1 15.5 3.5V5" /></svg>
                </button>
              </div>
              <ul class="journal" id="trace-turns"></ul>
            </section>
          </section>
        </section>
      </section>
    </main>
    <script src="./shared/js/navigation.js" defer></script>
    <script type="module" src="./pages/dashboard/overview.js"></script>
    <script type="module" src="./pages/dashboard/trace.js"></script>
    <script type="module" src="./pages/dashboard/dashboard.js"></script>
  </body>
</html>

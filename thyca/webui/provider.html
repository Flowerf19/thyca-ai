<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#714327" />
    <title>Thyca — Provider</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./shared/css/tokens.css" />
    <link rel="stylesheet" href="./shared/css/kit.css" />
    <link rel="stylesheet" href="./shared/css/settings.css" />
    <link rel="stylesheet" href="./shared/css/states.css" />
    <link rel="stylesheet" href="./shared/css/markdown.css" />
    <link rel="stylesheet" href="./pages/provider/provider.css" />
  </head>
  <body>
    <main class="notebook-shell screen-shell settings-shell pick-shell provider-shell" aria-label="Provider Thyca">
      <header class="site-header">
        <button class="icon-button menu-button" type="button" aria-label="Mở mục lục">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h11" /></svg>
        </button>
        <p class="header-line">
          <time id="header-datetime" datetime=""></time>
          <span id="header-edition">Thyca</span>
        </p>
      </header>
      <aside class="sidebar" aria-label="Điều hướng cài đặt">
        <section class="sessions">
          <div class="sessions-heading">
            <h2>Cài đặt</h2>
          </div>
          <nav class="session-list" aria-label="Mục cài đặt">
            <a class="session-item" href="settings.html#chung"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Chung</span></a>
            <a class="session-item is-active" href="provider.html" aria-current="page"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Provider</span></a>
            <a class="session-item" href="settings.html#giao-dien"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Giao diện</span></a>
          </nav>
        </section>
      </aside>
      <section class="workspace" aria-label="Nhà cung cấp và mô hình">
        <section class="screen-surface" aria-label="Provider và mô hình">
          <header class="screen-heading">
            <button class="screen-back" type="button">‹ Cài đặt</button>
            <div class="screen-title"><h1>Provider</h1></div>
            <p class="screen-muted">Mỗi provider key riêng, mỗi model gọi đúng provider của nó.</p>
          </header>
          <form id="provider-form" class="screen-card" novalidate>
            <details class="provider-group fold-section" open aria-labelledby="provider-group-heading">
              <summary><h3 id="provider-group-heading">Nhà cung cấp</h3></summary>
              <div class="provider-columns">
                <div>
                  <ul class="pick-list" id="provider-list" aria-label="Danh sách provider"></ul>
                  <button class="screen-button pick-add" id="provider-add" type="button">Thêm</button>
                </div>
                <div>
                  <div class="detail-head">
                    <h3 id="provider-detail-name">Chưa có provider</h3>
                    <span class="pick-badge" id="provider-detail-badge" hidden>Mặc định</span>
                    <div class="detail-actions">
                      <button class="screen-button is-primary" id="provider-create" type="button" hidden>Tạo provider</button>
                      <button class="screen-button" id="provider-cancel" type="button" hidden>Hủy</button>
                    </div>
                  </div>
                  <div class="field-grid">
                    <label for="provider-name" id="provider-name-label" hidden>Tên</label>
                    <input class="screen-input" id="provider-name" name="provider-name" autocomplete="off" spellcheck="false" maxlength="64" placeholder="vd: openai-2" hidden />
                    <label for="provider-endpoint">Endpoint</label>
                    <input class="screen-input" id="provider-endpoint" name="provider-endpoint" type="url" inputmode="url" autocomplete="off" spellcheck="false" value="https://api.openai.com/v1" />
                    <label for="provider-key">Khóa API<span class="info-dot" title="Chỉ gửi về backend local khi kiểm tra hoặc lưu. Để trống để giữ khóa đã lưu.">ⓘ</span></label>
                    <div>
                      <input type="text" name="provider-username" value="thyca-local" autocomplete="username" hidden tabindex="-1" aria-hidden="true" />
                      <input class="screen-input" id="provider-key" name="provider-key" type="password" autocomplete="new-password" maxlength="200" placeholder="Để trống để giữ khóa đã lưu" />
                    </div>
                    <label for="provider">Kiểu endpoint</label>
                    <select class="screen-select" id="provider" name="provider"><option value="openai">OpenAI</option><option value="openrouter">OpenRouter</option><option value="local">Local</option><option value="custom">OpenAI-compatible</option></select>
                    <label for="provider-api">Kiểu API<span class="info-dot" title="Responses trả kèm thinking summaries để hiện suy nghĩ của model.">ⓘ</span></label>
                    <select class="screen-select" id="provider-api" name="provider-api"><option value="openai_chat">Chat completions</option><option value="openai_responses">Responses</option></select>
                  </div>
                  <div class="provider-verify-row">
                    <button class="screen-button is-primary" id="verify-provider" type="button">Kiểm tra &amp; tải model</button>
                  </div>
                </div>
              </div>
            </details>
            <details class="provider-group fold-section" open aria-labelledby="model-group-heading">
              <summary><h3 id="model-group-heading">Mô hình <span id="model-provider-name"></span></h3></summary>
              <div class="provider-columns">
                <div>
                  <ul class="pick-list" id="model-listbox" aria-label="Model của provider"></ul>
                  <button class="screen-button pick-add" id="model-add" type="button">Thêm</button>
                </div>
                <div>
                  <div class="detail-head" id="model-add-head" hidden>
                    <h3>Model mới</h3>
                  </div>
                  <div class="field-grid">
                    <label for="model">Model ID</label>
                    <div class="model-id-wrap">
                      <input class="screen-input" id="model" name="model" required autocomplete="off" spellcheck="false" />
                      <ul class="model-suggest" id="model-suggest" role="listbox" aria-label="Gợi ý model" hidden></ul>
                    </div>
                    <label for="reasoning-effort">Mức suy luận</label>
                    <select class="screen-select" id="reasoning-effort" name="reasoning-effort"></select>
                    <label for="reasoning-custom" id="reasoning-custom-label" hidden>Tự đặt</label>
                    <input class="screen-input" id="reasoning-custom" name="reasoning-custom" autocomplete="off" spellcheck="false" maxlength="120" placeholder="vd: low, high, xhigh" hidden />
                  </div>
                  <div class="mini-quad">
                    <div>
                      <label for="context-window" title="Đơn vị: token">Ngữ cảnh</label>
                      <input class="screen-input" id="context-window" name="context-window" type="number" min="1000" max="2000000" step="1" value="128000" inputmode="numeric" />
                    </div>
                    <div>
                      <label for="input-cost" title="USD / 1M token">Input cost</label>
                      <input class="screen-input" id="input-cost" name="input-cost" type="number" min="0" step="any" placeholder="mặc định backend" />
                    </div>
                    <div>
                      <label for="cache-input-cost" title="USD / 1M token">Cache cost</label>
                      <input class="screen-input" id="cache-input-cost" name="cache-input-cost" type="number" min="0" step="any" placeholder="mặc định backend" />
                    </div>
                    <div>
                      <label for="output-cost" title="USD / 1M token">Output cost</label>
                      <input class="screen-input" id="output-cost" name="output-cost" type="number" min="0" step="any" placeholder="mặc định backend" />
                    </div>
                  </div>
                  <div class="detail-actions" id="model-create-row" hidden>
                    <button class="screen-button is-primary" id="model-create" type="button">Tạo model</button>
                    <button class="screen-button" id="model-cancel" type="button">Hủy</button>
                  </div>
                  <div hidden>
                    <div>
                      <label for="loop-max">Vòng agent tối đa</label>
                      <input class="screen-input" id="loop-max" name="loop-max" type="number" min="1" max="200" step="1" inputmode="numeric" />
                    </div>
                    <div>
                      <label for="hot-tail-kb">Nhớ nóng (KB)</label>
                      <input class="screen-input" id="hot-tail-kb" name="hot-tail-kb" type="number" min="1" max="64" step="1" inputmode="numeric" />
                    </div>
                    <input id="reasoning-efforts" name="reasoning-efforts" autocomplete="off" spellcheck="false" hidden />
                  </div>
                </div>
              </div>
            </details>
            <!-- System defaults: hidden from users, values still read on save. -->
            <details class="provider-group fold-section" id="limits-group" hidden>
              <summary><h3 id="limits-heading">Giới hạn chung</h3></summary>
              <div class="fold-list">
                <article class="fold-row settings-row"><div><h3><label for="limits-loop-max">Số vòng agent tối đa</label></h3></div><input class="screen-input" id="limits-loop-max" name="limits-loop-max" type="number" min="1" max="200" step="1" inputmode="numeric" readonly title="Giá trị mặc định của hệ thống" /></article>
                <article class="fold-row settings-row"><div><h3><label for="limits-hot-tail-kb">Dung lượng nhớ nóng</label></h3></div><div class="settings-field"><input class="screen-input" id="limits-hot-tail-kb" name="limits-hot-tail-kb" type="number" min="1" max="64" step="1" inputmode="numeric" readonly title="Giá trị mặc định của hệ thống" /><span class="settings-unit">KB</span></div></article>
                <article class="fold-row settings-row"><div><h3><label for="limits-context-window">Cửa sổ ngữ cảnh</label></h3></div><div class="settings-field"><input class="screen-input" id="limits-context-window" name="limits-context-window" type="number" min="1000" max="2000000" step="1" inputmode="numeric" readonly title="Giá trị mặc định của hệ thống" /><span class="settings-unit">token</span></div></article>
                <article class="fold-row settings-row"><div><h3><label for="limits-soft-timeout">Soft timeout chờ tool</label></h3></div><div class="settings-field"><input class="screen-input" id="limits-soft-timeout" name="limits-soft-timeout" type="number" min="1" max="300" step="1" inputmode="numeric" readonly title="Giá trị mặc định của hệ thống" /><span class="settings-unit">giây</span></div></article>
              </div>
            </details>
            <div class="provider-actions">
              <div class="thyca-nudge provider-nudge" id="provider-status" role="status" aria-live="polite"></div>
              <button class="screen-button is-primary" id="save-provider" type="submit">Lưu cấu hình</button>
              <button class="screen-button settings-reset" type="button">Hoàn tác thay đổi</button>
            </div>
          </form>
        </section>
      </section>
    </main>
    <script src="./shared/js/navigation.js" defer></script>
    <script type="module" src="./pages/provider/provider.js"></script>
  </body>
</html>

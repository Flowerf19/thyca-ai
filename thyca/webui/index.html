<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#714327" />
    <title>Thyca — Sổ trò chuyện</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared/css/tokens.css" />
    <link rel="stylesheet" href="./shared/css/kit.css" />
    <link rel="stylesheet" href="./shared/css/states.css" />
    <link rel="stylesheet" href="./shared/css/markdown.css" />
    <link rel="stylesheet" href="./pages/chat/chat.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="notebook-shell" aria-label="Thyca — sổ trò chuyện">
      <header class="site-header">
        <button class="icon-button menu-button" type="button" aria-label="Mở mục lục">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h11" /></svg>
        </button>
        <p class="header-line">
          <time id="header-datetime" datetime=""></time>
          <span id="header-edition">Thyca</span>
        </p>
      </header>

      <aside class="sidebar" id="chat-sidebar" aria-label="Các phiên trò chuyện">
        <section class="sessions">
          <div class="sessions-heading">
            <h2>Phiên trò chuyện</h2>
            <button class="new-session" id="new-session" type="button" aria-label="Tạo phiên trò chuyện mới">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
            </button>
          </div>

          <nav class="session-list" id="session-list" aria-label="Phiên gần đây" aria-live="polite">
            <p class="sidebar-state">Đang tải phiên…</p>
          </nav>
        </section>

      </aside>

      <section class="workspace" aria-label="Nội dung trò chuyện">
        <section class="chat-canvas" aria-label="Trò chuyện hôm nay">
          <header class="chat-title-head">
            <div class="screen-title"><h1 id="chat-title">Phiên trống</h1></div>
          </header>
          <div class="conversation-scroll" id="conversation-scroll">
            <div class="conversation-content">
              <div class="message-list" id="message-list" aria-live="polite" aria-busy="true"></div>

              <div class="music-watermark" aria-hidden="true">
                <svg viewBox="0 0 420 230">
                  <g class="staff-lines">
                    <path d="M42 76C144 57 263 58 397 72" />
                    <path d="M40 94C143 75 263 76 399 90" />
                    <path d="M39 112C142 93 263 94 400 108" />
                    <path d="M40 130C143 111 263 112 399 126" />
                    <path d="M42 148C144 129 263 130 397 144" />
                  </g>
                  <path class="treble" d="M94 169c-28-16-29-55 5-67 26-9 46 9 37 29-7 16-31 14-34-2-3-18 29-35 36-60 5-17-8-32-20-18-13 15-10 38-4 59l18 70c5 18-6 35-22 36-17 1-27-17-17-29 8-10 24-5 24 7" />
                  <g class="water-notes">
                    <ellipse cx="205" cy="127" rx="13" ry="9" transform="rotate(-16 205 127)" />
                    <path d="M216 124V57" />
                    <path d="M216 57c25 2 32 13 31 28" />
                    <ellipse cx="283" cy="97" rx="13" ry="9" transform="rotate(-16 283 97)" />
                    <path d="M294 94V36" />
                    <ellipse cx="343" cy="139" rx="13" ry="9" transform="rotate(-16 343 139)" />
                    <path d="M354 136V70" />
                    <path d="M294 48 354 62" />
                  </g>
                </svg>
              </div>
            </div>
          </div>

          <button class="to-bottom" id="to-bottom" type="button" aria-label="Xuống cuối cuộc trò chuyện" aria-controls="conversation-scroll" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14M6.5 12.5 12 18l5.5-5.5" /></svg>
          </button>
        </section>

        <footer class="site-footer">
        <form class="composer" id="composer" aria-label="Soạn tin nhắn">
          <label class="letter-label" for="message">Gửi Thyca,</label>
          <textarea id="message" name="message" rows="1" maxlength="4000" placeholder="Viết vài dòng cho Thyca…"></textarea>
          <div class="composer-toolbar">
            <div class="composer-tools">
              <button class="attach-button" type="button" disabled title="Chưa hỗ trợ đính kèm">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.2 12 20.6a5.5 5.5 0 0 1-7.8-7.8l9.4-9.4a3.5 3.5 0 0 1 5 5L9.2 17.8a1.5 1.5 0 0 1-2.1-2.1l8.5-8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
                <span>Tệp</span>
              </button>
              <button class="voice-button" type="button" disabled title="Chưa hỗ trợ nhập bằng giọng nói">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3.5" width="7" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.7" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
                <span>Nói</span>
              </button>
            </div>
            <div class="composer-send">
              <label class="effort-control model-control" for="composer-model"><span class="effort-label">Model</span>
                <select class="effort-select model-select" id="composer-model">
                  <option value="" disabled selected>Model</option>
                </select>
              </label>
              <label class="effort-control" for="thinking-effort"><span class="effort-label">Suy nghĩ</span>
                <select class="effort-select" id="thinking-effort"></select>
              </label>
              <button class="send-button" id="send-message" type="submit" aria-label="Gửi tin nhắn">Gửi</button>
              <button class="stop-button" id="stop-button" type="button" aria-label="Dừng">Dừng</button>
            </div>
          </div>
          <p class="visually-hidden" id="composer-hint" role="status" aria-live="polite"></p>
          <div class="chat-idle-nudge" id="idle-nudge" hidden>
            <p>Phiên im 15 phút — Thyca có nên ghi nhớ điều gì không?</p>
            <div>
              <button class="screen-button is-primary" id="idle-remember" type="button">Nhớ</button>
              <button class="screen-button" id="idle-dismiss" type="button">Để sau</button>
            </div>
          </div>
        </form>
        </footer>
      </section>
    </main>

    <dialog class="screen-dialog" id="rename-dialog" aria-labelledby="rename-title">
      <form method="dialog" id="rename-form">
        <h2 id="rename-title">Đặt tên phiên</h2>
        <input type="hidden" id="rename-id">
        <label for="rename-name">Tên phiên<input class="screen-input" id="rename-name" required maxlength="120" autocomplete="off"></label>
        <p class="screen-status" id="rename-status" role="status" aria-live="polite"></p>
        <div class="screen-toolbar">
          <button class="screen-button" id="cancel-rename" type="button">Hủy</button>
          <button class="screen-button is-primary" type="submit">Lưu tên</button>
        </div>
      </form>
    </dialog>

    <dialog class="screen-dialog" id="delete-dialog" aria-labelledby="delete-title">
      <form method="dialog" id="delete-form">
        <h2 id="delete-title">Xóa phiên này?</h2>
        <p class="screen-note" id="delete-note"></p>
        <p class="screen-status" id="delete-status" role="status" aria-live="polite"></p>
        <div class="screen-toolbar">
          <button class="screen-button" id="cancel-delete" type="button">Hủy</button>
          <button class="screen-button is-danger" id="confirm-delete" type="submit">Xóa phiên</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./pages/chat/app.js"></script>
    <script src="./shared/js/navigation.js" defer></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thyca — Trợ lý cá nhân</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,450;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <a class="skip" href="#line">Tới ô chat</a>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Thyca">
        <div class="sidebar-main">
          <header class="sidebar-head">
            <button class="icon-button sidebar-close" id="close-sidebar" type="button" aria-label="Đóng mục lục">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
            </button>
          </header>

          <label class="search-field" for="page-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.8" /><path d="m15.2 15.2 4.1 4.1" /></svg>
            <span class="visually-hidden">Tìm phiên, memory, lượt</span>
            <input id="page-search" type="search" placeholder="Tìm phiên, file, lượt…" autocomplete="off" />
            <kbd>/</kbd>
          </label>

          <button class="new-page" id="new-page" type="button">
            <span class="new-page-mark" aria-hidden="true">+</span>
            <span>Phiên mới</span>
            <span class="new-page-key">N</span>
          </button>

          <nav class="library" aria-label="Các bề mặt">
            <div class="library-heading">
              <span>Bề mặt</span>
              <span class="library-count"></span>
            </div>
            <div class="mode-list" id="mode-list">
              <button class="mode-link is-active" type="button" data-mode="chat" aria-current="page">
                <span class="mode-icon mode-icon-chat" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M5 7h14v8H8l-3 3V7Z" /><path d="M9 11h6M9 14h4" /></svg>
                </span>
                <span class="mode-name">Chat</span>
                <span class="mode-count">3</span>
              </button>
              <button class="mode-link" type="button" data-mode="memories">
                <span class="mode-icon mode-icon-memories" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M7 4.5h7.5L19 9v10.5H7zM14.5 4.5V9H19" /><path d="M9.5 13h7M9.5 16.5h5" /></svg>
                </span>
                <span class="mode-name">Memories</span>
                <span class="mode-count">5</span>
              </button>
              <button class="mode-link" type="button" data-mode="trace">
                <span class="mode-icon mode-icon-trace" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2" /><circle cx="12" cy="7" r="2" /><circle cx="18" cy="12" r="2" /><circle cx="12" cy="17" r="2" /><path d="M8 11.2 10.2 8.4M13.8 8.4 16 11.2M16 12.8 13.8 15.6M10.2 15.6 8 12.8" /></svg>
                </span>
                <span class="mode-name">Trace</span>
                <span class="mode-count">2</span>
              </button>
            </div>
          </nav>

          <div class="page-list-wrap">
            <div class="library-heading">
              <span id="page-list-label">Phiên gần đây</span>
              <button class="text-button" id="sort-pages" type="button">Mới nhất</button>
            </div>
            <div class="page-list" id="page-list" aria-live="polite"></div>
            <p class="search-empty" id="search-empty" hidden>Không thấy mục nào.</p>
          </div>

          <footer class="sidebar-foot">
            <div class="foot-row">
              <button class="foot-action" type="button" id="settings-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM4.8 13.4l-1.1.8 1.5 2.6 1.3-.5a7.8 7.8 0 0 0 1.8 1.1l.2 1.4h3l.2-1.4a7.8 7.8 0 0 0 1.8-1.1l1.3.5 1.5-2.6-1.1-.8c.1-.6.1-1.2 0-1.8l1.1-.8-1.5-2.6-1.3.5a7.8 7.8 0 0 0-1.8-1.1l-.2-1.4h-3l-.2 1.4a7.8 7.8 0 0 0-1.8 1.1l-1.3-.5-1.5 2.6 1.1.8c-.1.6-.1 1.2 0 1.8Z" /></svg>
                <span>Cài đặt</span>
              </button>
              <span class="sync-note"><i aria-hidden="true"></i> ~/.thyca</span>
            </div>
            <p class="foot-note"><span>Thyca harness</span><a class="foot-github" href="https://github.com/Flowerf19/thyca-ai" rel="noreferrer" aria-label="GitHub Thyca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.56 9.56 0 0 1 2.504.337c1.909-1.294 2.748-1.025 2.748-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48A10.01 10.01 0 0 0 22 12c0-5.523-4.477-10-10-10z" /></svg></a></p>
          </footer>
        </div>
      </aside>

      <div class="scrim" id="scrim" hidden></div>

      <main class="workspace" id="workspace">
        <header class="topbar">
          <div class="topbar-start">
            <button class="icon-button menu-button" id="open-sidebar" type="button" aria-label="Mở mục lục" aria-controls="sidebar" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" /></svg>
            </button>
            <div class="breadcrumb"><strong class="crumb-kicker" id="mode-breadcrumb">Chat</strong></div>
          </div>
          <div class="topbar-actions">
            <div class="mini-player" id="mini-player" hidden>
              <button class="mini-play" id="mini-play" type="button" aria-label="Phát lại lượt" aria-pressed="false">
                <span class="mini-play-symbol" aria-hidden="true">▶</span>
              </button>
              <div class="mini-player-copy">
                <strong id="mini-phase">think</strong>
                <small id="mini-round">round 2 / 10</small>
              </div>
            </div>
            <button class="top-action" type="button" id="focus-mode" aria-pressed="false">Tập trung</button>
            <button class="icon-button" type="button" id="more-btn" aria-label="Thêm tùy chọn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="19" cy="12" r="1.2" /></svg>
            </button>
          </div>
        </header>

        <section class="notebook" id="notebook" data-mode="chat">
          <div class="paper-texture" aria-hidden="true"></div>
          <div class="notebook-inner">
            <header class="page-header" id="page-header"></header>
            <div class="page-body" id="page-body"></div>
          </div>

          <form class="composer" id="composer">
            <div class="composer-inner" id="field">
              <div class="composer-chips" id="composer-chips" aria-label="Gợi ý nhanh"></div>
              <label class="visually-hidden" for="line">Tin nhắn</label>
              <div class="writing-line">
                <textarea
                  id="line"
                  name="line"
                  rows="1"
                  maxlength="4000"
                  placeholder="Nói với Thyca…"
                  aria-describedby="hint"
                  autocomplete="off"
                ></textarea>
                <button
                  class="send bookmark-action"
                  id="send"
                  type="submit"
                  aria-label="Gửi tin"
                  title="Gửi tin (Enter)"
                >
                  <span class="bookmark-shape" aria-hidden="true"></span>
                  <svg class="pen-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                    <path d="m6.5 25.5.9-4.1L21.8 7l3.2 3.2L10.6 24.6l-4.1.9Z" />
                    <path d="m20.4 8.4 3.2 3.2M8.1 21.8l2.1 2.1" />
                  </svg>
                  <span class="visually-hidden">Gửi</span>
                </button>
              </div>
              <div class="idle-nudge" id="idle-nudge" hidden>
                <p>Phiên im 15 phút — nhớ gì không?</p>
                <div class="idle-nudge-actions">
                  <button class="suggestion-chip" id="idle-remember" type="button">Nhớ</button>
                  <button class="suggestion-chip" id="idle-dismiss" type="button">Để sau</button>
                </div>
              </div>
              <div class="composer-meta">
                <p class="hint" id="hint" aria-live="polite"></p>
                <span class="shortcut">Enter gửi · Shift+Enter xuống dòng</span>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>

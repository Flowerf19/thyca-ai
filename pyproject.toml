[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "thyca-ai"
version = "0.7.6"
description = "Thyca — personal harness"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "thyca" }]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "rapidfuzz>=3,<4",
    "filelock>=3.16,<4",
    "platformdirs>=4.3,<5",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
]

[project.scripts]
thyca = "thyca.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["thyca"]

[tool.hatch.build.targets.wheel.force-include]
"thyca/llm/prompts/soul.md" = "thyca/llm/prompts/soul.md"
"thyca/llm/prompts/identity.md" = "thyca/llm/prompts/identity.md"
"thyca/read_after_config.md" = "thyca/read_after_config.md"
"webui" = "thyca/webui"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#714327">
    <title>Thyca — Nhật ký</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./shared/css/tokens.css">
    <link rel="stylesheet" href="./shared/css/kit.css">
    <link rel="stylesheet" href="./shared/css/states.css">
    <link rel="stylesheet" href="./shared/css/markdown.css">
    <link rel="stylesheet" href="./shared/css/bot-avatar.css">
    <link rel="stylesheet" href="./shared/css/bot-envelope.css">
    <link rel="stylesheet" href="./pages/memories/memories.css">
  </head>
  <body>
    <main class="notebook-shell screen-shell memories-shell" aria-label="Nhật ký">
      <header class="site-header">
        <button class="icon-button menu-button" type="button" aria-label="Mở mục lục">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h11" /></svg>
        </button>
        <p class="header-line">
          <time id="header-datetime" datetime=""></time>
          <span id="header-edition">Thyca</span>
        </p>
      </header>
      <aside class="sidebar" aria-label="Điều hướng nhật ký">
        <section class="sessions" id="memory-nav">
          <div class="sessions-heading">
            <h2>Nhật ký</h2>
          </div>
          <div class="memory-search-cluster">
            <div class="thyca-search" role="search">
              <svg class="thyca-search__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M16.2 16.2 20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <input class="thyca-search__input" id="memory-search" type="search" placeholder="Tìm trong nhật ký…" autocomplete="off" aria-label="Tìm trong nhật ký">
              <button type="button" class="thyca-search__clear" aria-label="Xóa">
                <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                  <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <p class="screen-note memory-status" id="memory-status" role="status" aria-live="polite"></p>
          </div>
          <nav class="session-list memory-scope-list" id="memory-global-nav" aria-label="Bộ nhớ tổng thể">
            <button class="memory-global-choice" id="memory-scope-global" type="button" data-memory-scope="" aria-current="page" aria-pressed="true">Tổng quan</button>
          </nav>
          <nav class="session-list memory-scope-list" id="memory-bot-list" aria-label="Chọn bot" aria-live="polite"></nav>
          <div class="memory-roster-error" id="memory-roster-error" role="status" aria-live="polite" hidden>
            <p id="memory-roster-status">Không tải được danh sách bot.</p>
            <button class="screen-button" id="memory-roster-retry" type="button">Thử tải lại</button>
          </div>
        </section>
      </aside>

      <section class="workspace" aria-label="Nội dung nhật ký">
        <section class="screen-surface memories-surface" id="memory-workspace" aria-label="Bộ nhớ đã chọn" aria-busy="true">
          <div class="screen-title"><h1 id="memory-scope-title">Nhật ký của bạn</h1></div>
          <p class="screen-note memories-rule" id="memory-scope-description">Những trang Thyca ghi lại từ các cuộc trò chuyện.</p>
          <p id="memory-empty" class="memory-empty" hidden></p>
          <div class="memory-search-bar"></div>
          <div id="memory-sections" aria-live="polite">
            <section class="memory-view" data-view="overview">
              <details class="fold-section" open>
                <summary><h3>Tổng quan</h3></summary>
                <div class="memory-view-body"></div>
              </details>
            </section>
            <section class="memory-view" data-view="day">
              <details class="fold-section" open>
                <summary><h3>Theo ngày</h3></summary>
                <div class="memory-view-body"></div>
              </details>
            </section>
            <section class="memory-view" data-view="used-more">
              <details class="fold-section" open>
                <summary><h3>Dùng nhiều</h3></summary>
                <div class="memory-view-body"></div>
              </details>
            </section>
            <section class="memory-view" data-view="searched-more">
              <details class="fold-section" open>
                <summary><h3>Tìm nhiều</h3></summary>
                <div class="memory-view-body"></div>
              </details>
            </section>
            <section class="memory-view" data-view="used-less">
              <details class="fold-section" open>
                <summary><h3>Dùng ít</h3></summary>
                <div class="memory-view-body"></div>
              </details>
            </section>
          </div>
          <section class="pending-view" id="pending-view" aria-label="Chờ cho cả đội nhớ" hidden>
            <h2>Chờ cho cả đội nhớ</h2>
            <p class="screen-note memories-rule">Những điều các bot muốn cả đội cùng nhớ — duyệt mới ghi chung.</p>
            <div class="screen-filters pending-filters" id="pending-filters" role="group" aria-label="Lọc theo bot"></div>
            <div id="pending-list" class="memory-list" aria-live="polite"></div>
            <p id="pending-empty" class="memory-empty" hidden>Không có đề xuất nào đang chờ.</p>
            <p class="screen-note memory-status" id="pending-status" role="status" aria-live="polite"></p>
          </section>
        </section>
      </section>
    </main>

    <script src="./shared/js/navigation.js" defer></script>
    <script type="module" src="./pages/memories/memories.js"></script>
    <script type="module" src="./pages/memories/team-pending.js"></script>
  </body>
</html>

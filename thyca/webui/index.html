<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#714327" />
    <title>Thyca — Sổ trò chuyện</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./screens.css" />
    <link rel="stylesheet" href="./backend.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="notebook-shell" aria-label="Thyca — sổ trò chuyện">
      <aside class="sidebar" id="chat-sidebar" aria-label="Các phiên trò chuyện">
        <header class="sidebar-top">
          <button class="icon-button menu-button" type="button" aria-label="Mở mục lục">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h11" /></svg>
          </button>
        </header>

        <section class="sessions">
          <div class="sessions-heading">
            <h2>Phiên trò chuyện</h2>
            <button class="new-session" id="new-session" type="button" aria-label="Tạo phiên trò chuyện mới">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
            </button>
          </div>

          <nav class="session-list" id="session-list" aria-label="Phiên gần đây" aria-live="polite">
            <p class="sidebar-state">Đang tải phiên…</p>
          </nav>
        </section>

        <footer class="sidebar-bottom">
          <button class="trash-button" type="button" disabled title="Backend chưa hỗ trợ thùng rác">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4.8h6V7M7.5 7l.8 12h7.4l.8-12M10 10.5v5M14 10.5v5" /></svg>
            <span>Thùng rác</span>
          </button>
        </footer>
      </aside>

      <section class="workspace" aria-label="Nội dung trò chuyện">
        <header class="brand-header">
          <svg class="brand-sprig" viewBox="0 0 82 30" aria-hidden="true">
            <path d="M5 23C23 21 29 8 47 6c11-1 20 4 29 13" />
            <path d="M18 19c-1-6 3-11 10-12M36 10c0-6 6-10 12-9M53 8c3-5 9-7 14-3M65 13c4-3 9-2 12 2" />
            <path class="sprig-leaf" d="M20 16c-6 1-9-1-10-5 5-1 9 1 10 5ZM39 8c-5-3-5-7-2-10 5 3 6 7 2 10ZM57 7c1-5 5-8 9-7 0 5-4 8-9 7ZM68 13c4-4 8-4 11-1-3 4-7 4-11 1Z" />
            <circle cx="18" cy="10" r="2.1" /><circle cx="49" cy="3.5" r="2.1" /><circle cx="70" cy="16" r="2.1" />
          </svg>
          <h1>Thyca</h1>
          <svg class="brand-sprig is-right" viewBox="0 0 82 30" aria-hidden="true">
            <path d="M5 23C23 21 29 8 47 6c11-1 20 4 29 13" />
            <path d="M18 19c-1-6 3-11 10-12M36 10c0-6 6-10 12-9M53 8c3-5 9-7 14-3M65 13c4-3 9-2 12 2" />
            <path class="sprig-leaf" d="M20 16c-6 1-9-1-10-5 5-1 9 1 10 5ZM39 8c-5-3-5-7-2-10 5 3 6 7 2 10ZM57 7c1-5 5-8 9-7 0 5-4 8-9 7ZM68 13c4-4 8-4 11-1-3 4-7 4-11 1Z" />
            <circle cx="18" cy="10" r="2.1" /><circle cx="49" cy="3.5" r="2.1" /><circle cx="70" cy="16" r="2.1" />
          </svg>
        </header>

        <section class="chat-canvas" aria-label="Trò chuyện hôm nay">
          <div class="conversation-scroll" id="conversation-scroll">
            <div class="conversation-content">
              <p class="day-divider"><span id="conversation-label">Hôm nay</span></p>
              <div class="message-list" id="message-list" aria-live="polite" aria-busy="true"></div>

              <div class="music-watermark" aria-hidden="true">
                <svg viewBox="0 0 420 230">
                  <g class="staff-lines">
                    <path d="M42 76C144 57 263 58 397 72" />
                    <path d="M40 94C143 75 263 76 399 90" />
                    <path d="M39 112C142 93 263 94 400 108" />
                    <path d="M40 130C143 111 263 112 399 126" />
                    <path d="M42 148C144 129 263 130 397 144" />
                  </g>
                  <path class="treble" d="M94 169c-28-16-29-55 5-67 26-9 46 9 37 29-7 16-31 14-34-2-3-18 29-35 36-60 5-17-8-32-20-18-13 15-10 38-4 59l18 70c5 18-6 35-22 36-17 1-27-17-17-29 8-10 24-5 24 7" />
                  <g class="water-notes">
                    <ellipse cx="205" cy="127" rx="13" ry="9" transform="rotate(-16 205 127)" />
                    <path d="M216 124V57" />
                    <path d="M216 57c25 2 32 13 31 28" />
                    <ellipse cx="283" cy="97" rx="13" ry="9" transform="rotate(-16 283 97)" />
                    <path d="M294 94V36" />
                    <ellipse cx="343" cy="139" rx="13" ry="9" transform="rotate(-16 343 139)" />
                    <path d="M354 136V70" />
                    <path d="M294 48 354 62" />
                  </g>
                </svg>
              </div>
              <div class="conversation-end" id="conversation-end" aria-hidden="true"></div>
            </div>
          </div>

          <button class="to-bottom" id="to-bottom" type="button" aria-label="Xuống cuối cuộc trò chuyện" aria-controls="conversation-scroll" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14M6.5 12.5 12 18l5.5-5.5" /></svg>
          </button>

          <form class="composer" id="composer" aria-label="Soạn tin nhắn">
            <div class="composer-pill">
              <button class="mic-button" type="button" aria-label="Nhập bằng giọng nói" disabled title="Chưa hỗ trợ nhập giọng nói">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3.5" width="7" height="12" rx="3.5" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" /></svg>
              </button>
              <label class="visually-hidden" for="message">Tin nhắn</label>
              <textarea id="message" name="message" rows="1" maxlength="4000" placeholder="Nói với Thyca" aria-describedby="composer-status"></textarea>
              <button class="send-button" id="send-message" type="submit" aria-label="Gửi tin nhắn">
                <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 13 23 4.5c.8-.35 1.6.45 1.25 1.25L16 24c-.4.9-1.7.85-2-.08l-2.3-7.2L4.1 14.8c-1-.25-.95-1.45-.1-1.8Z" /><path d="m11.7 16.7 5.7-5.5" /></svg>
              </button>
            </div>
            <p class="composer-status" id="composer-status" role="status" aria-live="polite"></p>
            <div class="chat-idle-nudge" id="idle-nudge" hidden>
              <p>Phiên im 15 phút — Thyca có nên ghi nhớ điều gì không?</p>
              <div>
                <button class="screen-button is-primary" id="idle-remember" type="button">Nhớ</button>
                <button class="screen-button" id="idle-dismiss" type="button">Để sau</button>
              </div>
            </div>
          </form>
        </section>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
    <script src="./navigation.js" defer></script>
  </body>
</html>

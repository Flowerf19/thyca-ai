<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#714327">
    <title>Thyca — Nhật ký</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./screens.css">
    <link rel="stylesheet" href="./memories.css">
    <link rel="stylesheet" href="./backend.css">
  </head>
  <body>
    <main class="notebook-shell screen-shell memories-shell" aria-label="Nhật ký của bạn">
      <header class="site-header">
        <button class="icon-button menu-button" type="button" aria-label="Mở mục lục">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h11" /></svg>
        </button>
        <p class="header-line">
          <time id="header-datetime" datetime=""></time>
          <span id="header-edition">Thyca</span>
        </p>
      </header>
      <aside class="sidebar" aria-label="Điều hướng chính">
        <section class="sessions">
          <div class="sessions-heading">
            <h2>Nhật ký</h2>
          </div>
          <div class="memory-search-cluster">
          <div class="thyca-search" role="search">
            <svg class="thyca-search__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/>
              <path d="M16.2 16.2 20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input class="thyca-search__input" id="memory-search" type="search" placeholder="Tìm trong nhật ký…" autocomplete="off" aria-label="Tìm trong nhật ký">
            <button type="button" class="thyca-search__clear" aria-label="Xóa">
              <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="screen-note memory-status" id="memory-status" role="status" aria-live="polite"></p>
          </div>
          <nav class="session-list" aria-label="Chia nhật ký">
            <button class="session-item is-active" type="button" data-view="overview" aria-pressed="true"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Tổng quan</span></button>
            <button class="session-item" type="button" data-view="day" aria-pressed="false"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Theo ngày</span></button>
            <button class="session-item" type="button" data-view="used-more" aria-pressed="false"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Dùng nhiều</span></button>
            <button class="session-item" type="button" data-view="searched-more" aria-pressed="false"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Tìm nhiều</span></button>
            <button class="session-item" type="button" data-view="used-less" aria-pressed="false"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Dùng ít</span></button>
          </nav>
        </section>
      </aside>

      <section class="workspace" aria-label="Không gian nhật ký">
        <section class="screen-surface memories-surface" aria-label="Danh sách nhật ký">
          <div class="screen-title"><h1>Nhật ký của bạn</h1></div>
          <p class="screen-note memories-rule">Những trang Thyca ghi lại từ các cuộc trò chuyện.</p>
          <div id="memory-list" class="memory-list" aria-live="polite"></div>
          <div class="memory-search-bar"></div>
          <!-- Mobile (≤56rem) renders every view as its own fold section on one
               page; desktop keeps the single switchable list above. -->
          <section class="memory-view" data-view="overview" hidden>
            <details class="fold-section" open>
              <summary><h3>Tổng quan</h3></summary>
              <div class="memory-view-body memory-overview"></div>
            </details>
          </section>
          <section class="memory-view" data-view="day" hidden>
            <details class="fold-section" open>
              <summary><h3>Theo ngày</h3></summary>
              <div class="memory-view-body"></div>
            </details>
          </section>
          <section class="memory-view" data-view="used-more" hidden>
            <details class="fold-section" open>
              <summary><h3>Dùng nhiều</h3></summary>
              <div class="memory-view-body"></div>
            </details>
          </section>
          <section class="memory-view" data-view="searched-more" hidden>
            <details class="fold-section" open>
              <summary><h3>Tìm nhiều</h3></summary>
              <div class="memory-view-body"></div>
            </details>
          </section>
          <section class="memory-view" data-view="used-less" hidden>
            <details class="fold-section" open>
              <summary><h3>Dùng ít</h3></summary>
              <div class="memory-view-body"></div>
            </details>
          </section>
          <p id="memory-empty" class="memory-empty" hidden>Không tìm thấy trang nhật ký phù hợp.</p>
        </section>
      </section>
    </main>

    <dialog class="screen-dialog" id="memory-dialog" aria-labelledby="dialog-title">
      <form method="dialog" id="memory-form">
        <h2 id="dialog-title">Sửa trang nhật ký</h2>
        <input type="hidden" id="memory-id">
        <label for="memory-title">Tiêu đề<input class="screen-input" id="memory-title" required maxlength="120"></label>
        <label for="memory-description">Mô tả<textarea class="screen-input" id="memory-description" required maxlength="400"></textarea></label>
        <p class="screen-status" id="memory-dialog-status" role="status" aria-live="polite"></p>
        <div class="screen-toolbar memory-dialog-actions">
          <button class="screen-button is-danger" id="forget-memory" type="button">Quên</button>
          <button class="screen-button" id="reinforce-memory" type="button">Gia hạn</button>
          <button class="screen-button" id="cancel-memory" type="button">Hủy</button>
          <button class="screen-button is-primary" id="save-memory" value="default" type="submit">Lưu trang</button>
        </div>
      </form>
    </dialog>

    <script src="./navigation.js" defer></script>
    <script type="module" src="./memories.js"></script>
  </body>
</html>

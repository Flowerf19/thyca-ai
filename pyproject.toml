[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "thyca-ai"
version = "0.7.9"
description = "Thyca — personal harness"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "thyca" }]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "rapidfuzz>=3,<4",
    "filelock>=3.16,<4",
    "platformdirs>=4.3,<5",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
]

[project.scripts]
thyca = "thyca.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["thyca"]
artifacts = ["thyca/webui/**/*.html", "thyca/webui/**/*.css", "thyca/webui/**/*.js", "thyca/webui/vendor/*"]

[tool.hatch.build.targets.wheel.force-include]
"thyca/llm/prompts/soul.md" = "thyca/llm/prompts/soul.md"
"thyca/llm/prompts/identity.md" = "thyca/llm/prompts/identity.md"
"thyca/read_after_config.md" = "thyca/read_after_config.md"
"thyca-css/index.html" = "thyca/webui/index.html"
"thyca-css/app.js" = "thyca/webui/app.js"
"thyca-css/memories.js" = "thyca/webui/memories.js"
"thyca-css/memories.html" = "thyca/webui/memories.html"
"thyca-css/trace.js" = "thyca/webui/trace.js"
"thyca-css/trace.html" = "thyca/webui/trace.html"
"thyca-css/provider.js" = "thyca/webui/provider.js"
"thyca-css/provider.html" = "thyca/webui/provider.html"
"thyca-css/cost.js" = "thyca/webui/cost.js"
"thyca-css/cost.html" = "thyca/webui/cost.html"
"thyca-css/usage.js" = "thyca/webui/usage.js"
"thyca-css/usage.html" = "thyca/webui/usage.html"
"thyca-css/dashboard.html" = "thyca/webui/dashboard.html"
"thyca-css/settings.html" = "thyca/webui/settings.html"
"thyca-css/settings.js" = "thyca/webui/settings.js"
"thyca-css/navigation.js" = "thyca/webui/navigation.js"
"thyca-css/dashboard.js" = "thyca/webui/dashboard.js"
"thyca-css/styles.css" = "thyca/webui/styles.css"
"thyca-css/screens.css" = "thyca/webui/screens.css"
"thyca-css/cost.css" = "thyca/webui/cost.css"
"thyca-css/dashboard.css" = "thyca/webui/dashboard.css"
"thyca-css/memories.css" = "thyca/webui/memories.css"
"thyca-css/settings.css" = "thyca/webui/settings.css"
"thyca-css/trace.css" = "thyca/webui/trace.css"
"thyca-css/usage.css" = "thyca/webui/usage.css"
"thyca-css/backend.css" = "thyca/webui/backend.css"
"thyca-css/backend" = "thyca/webui/backend"
"thyca-css/vendor" = "thyca/webui/vendor"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

/* ===== ./shared/css/tokens.css ===== */
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4
 * genre: editorial · macrostructure: Workbench · theme: studied-DNA (user image)
 * tone: cream paper, terracotta leather, quiet botanical notebook
 * fonts: Fraunces · Source Serif 4 · Be Vietnam Pro
 */

:root {
  --color-bg-frame: #E8DAC3;
  --color-bg-surface: #FBF4E5;
  --color-bg-selected: #EADBC8;

  --color-desk-top: var(--color-bg-frame);
  --color-desk-mid: var(--color-bg-frame);
  --color-desk-bottom: var(--color-bg-frame);
  --color-shell-shadow: oklch(21.7% 0.047 45.8 / 0.72);
  --color-shell-shadow-soft: oklch(25% 0.06 44 / 0.32);

  --color-paper: var(--color-bg-frame);
  --color-paper-chat: var(--color-bg-surface);
  --color-paper-card: var(--color-bg-surface);
  --color-paper-input: var(--color-bg-surface);
  --color-paper-edge: oklch(82% 0.045 72);
  --color-border: oklch(87.4% 0.024 69.6);
  --color-divider: #C8B59B;

  --color-ink: oklch(30.9% 0.064 43.9);
  --color-reading: oklch(33.5% 0.021 70);
  --color-muted: oklch(48.2% 0.033 68.6);
  --color-muted-soft: oklch(57.6% 0.041 66.9);
  --color-accent: oklch(55.5% 0.13 38.2);
  --color-accent-deep: oklch(51.7% 0.134 36.5);
  /* Team r9: bot lỗi dùng màu này. Định nghĩa từ accent-deep để không
     thêm mã màu literal mới — CSS team chỉ dùng token sẵn có. */
  --color-danger: var(--color-accent-deep);
  --color-accent-soft: oklch(89.2% 0.049 72.2);
  --color-accent-ink: oklch(95.6% 0.021 65.3);
  --color-botanical: oklch(51.3% 0.049 68.6);

  --note-do: #B8734B;
  --note-re: #9E6B60;
  --note-mi: #C8A986;
  --note-fa: #A5894E;
  --note-sol: #84796A;
  --note-la: #8A5A40;
  --note-si: #7C5841;
  --note-star: #BF8F34;
  --note-gold: var(--note-star);
  --note-cream: #FAF3E6;
  --note-ink: #26160D;
  --bot-gold: #E8CF98;
  --wax-ink: #1D0F08;
  --wax-ink-deep: #120804;
  --wax-error: #8D8279;
  --wax-error-glyph: #D9CBB4;
  --wax-flash: #FFF3C8;

  --wood-star-light: #D09266;
  --wood-star-side: #7E4E30;
  --wood-hollow-light: #BB8A7E;
  --wood-hollow-side: #6E453D;
  --wood-single-flag-light: #DEC7A6;
  --wood-single-flag-side: #8F7352;
  --wood-double-flag-light: #C0A96E;
  --wood-double-flag-side: #6F5C32;
  --wood-dotted-light: #A39785;
  --wood-dotted-side: #5A5044;
  --wood-fermata-light: #AA7B5E;
  --wood-fermata-side: #5D3B28;
  --wood-plain-light: #9C7A5F;
  --wood-plain-side: #523A29;
  --wood-offline-base: #9E9080;
  --wood-offline-side: #5E5348;
  /* Stage vignette derived from the page palette, not the v3.5 demo hexes,
     so the shell reads as one continuous surface instead of a pasted panel. */
  --stage-top: var(--color-bg-surface);
  --stage-mid: color-mix(in oklab, var(--color-bg-surface) 55%, var(--color-bg-frame));
  --stage-edge: var(--color-bg-frame);
  --stage-border: var(--color-border);
  --stage-inner: rgba(80, 50, 20, 0.09);
  --note-bg: #F9DFD5;
  --note-fold: #E8BEB0;
  --note-lines: rgba(217, 93, 57, 0.16);
  --status-done: #4A8759;
  --status-waiting: #3E6B94;
  --status-error: #B84239;
  --status-offline: #B5A898;
  --avatar-eye: #2B211B;
  --avatar-eye-offline: #786D61;
  --avatar-star-offline: #BDB2A6;
  --avatar-hollow: #F7EDE2;
  --avatar-hollow-offline: #DFD5C8;
  --avatar-think: #8C7662;
  --avatar-halo: rgba(190, 85, 48, 0.10);
  --avatar-halo-ring: rgba(180, 90, 50, 0.42);
  --avatar-crescent: rgba(31, 20, 14, 0.14);
  --avatar-stamp-ink: #9E4020;

  --color-watermark: oklch(87.9% 0.037 80.6 / 0.58);
  --color-focus: oklch(51.7% 0.134 36.5);
  --chat-brand-ink: #3d2a1f;
  --chat-brand-accent: #a65a42;
  --chat-brand-wash: rgba(255, 222, 192, 0.42);
  /* A ghost of the brand colour: the user's tick is the same ink as Thyca's
     stripe, kept thin and faint so the two never read as the same mark. */
  --chat-user-tick: color-mix(in srgb, var(--chat-brand-accent) 35%, transparent);
  --ink: var(--chat-brand-ink);
  --terra: var(--chat-brand-accent);
  --composer-bg: var(--color-bg-surface);
  --composer-border: rgba(61, 42, 31, 0.12);

  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-reading: "Source Serif 4", ui-serif, Georgia, serif;
  --font-ui: "Be Vietnam Pro", ui-sans-serif, sans-serif;

  --space-xs: 0.5rem;
  --space-sm: 0.75rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;

  --radius-xs: 0.5rem;
  --radius-sm: 0.75rem;
  --radius-card: 1rem;
  --radius-chat: 1.25rem;
  --radius-shell: 1.75rem;
  --radius-pill: 999px;

  --rule: 1px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms;
  --dur-short: 220ms;
  --z-base: 1;
  --z-paper: 10;
  --z-content: 20;
}

html,
body {
  min-width: 0;
  min-height: 100%;
  overflow-x: clip;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100dvh;
  margin: 0;
  padding: 1.15rem;
  color: var(--color-reading);
  background-color: var(--color-desk-mid);
  background-image:
    radial-gradient(ellipse at 50% -22%, var(--color-desk-top) 0%, transparent 68%),
    linear-gradient(to bottom, transparent 45%, var(--color-desk-bottom) 118%);
  background-size: auto;
  font-family: var(--font-ui);
  font-size: 100%;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* Preferences set in Cài đặt (navigation.js mirrors them onto <html> on every
   page); they live here so each page honors them, not just settings/provider. */
html[data-type-scale="small"] { font-size: 93.75%; }
html[data-type-scale="large"] { font-size: 112.5%; }
html[data-theme="dusk"] {
  --color-desk-top: var(--color-bg-frame);
  --color-desk-mid: var(--color-bg-frame);
  --color-paper: var(--color-bg-frame);
  --color-paper-chat: var(--color-bg-surface);
}

button,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

svg {
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.65;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
/* Screen base + chart/mono tokens, moved from shared/css/screens.css (W6 TASK-006). */
:root {
  --color-chart-input: oklch(78% 0.077 65);
  --color-chart-cache: oklch(87% 0.054 72);
  --color-success-ink: oklch(43% 0.085 155);
  /* Bot avatar status badge (waiting): the one hue the paper palette
     has no equivalent for in the avatar design. */
  --color-status-waiting: oklch(51% 0.11 250);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}

[hidden] { display: none !important; }

a { color: inherit; }

</style>
  <style>
/* ===== ./shared/css/kit.css ===== */
/* Hallmark · macrostructure: Workbench · theme: studied-DNA (Thyca references)
 * Shared notebook screens · existing palette, typography and repaired corners.
 * Pre-emit critique: P5 H4 E4 S5 R5 V4
 */


.screen-shell { font-family: var(--font-reading); }
.screen-shell .screen-surface h2,
.screen-shell .screen-surface h3 { font-weight: 500; }
.screen-shell .screen-surface h2 { font-style: normal; margin: 0; font-size: 1.7rem; line-height: 1.25; }
.screen-shell .screen-surface h3 { margin: 0; }
/* All screen h3 headings use the Hồ sơ typography standard. Dynamic
   .markdown-body headings keep their separate content styling in markdown.css. */
.screen-shell .screen-surface h3 {
  font-style: normal;
  font-size: 1.15rem;
}
.screen-shell .screen-surface p { margin-block: 0.4rem; }
.screen-shell input, .screen-shell select, .screen-shell textarea, .screen-shell button { font: inherit; }

.screen-surface {
  flex: 1;
  min-width: 0;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  margin: 0;
  padding: 1.75rem;
  border: 0;
  border-radius: 0;
  background: transparent;
}

.screen-heading, .screen-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-md);
  margin-block-end: var(--space-lg);
}
.screen-heading > *, .screen-toolbar > * { min-width: 0; }
.screen-heading h2 { color: var(--color-ink); }
.screen-muted { color: var(--color-muted); }
.screen-note { color: var(--color-muted); font-size: 0.875rem; }
.screen-back { display: none; }

/* Page title · Nhật ký's centred reading-face with hairline ticks. Shared by
   Hồ sơ, Chi phí, Sử dụng token. */
.screen-title {
  display: flex;
  flex: 1 1 100%;
  justify-content: center;
  align-items: center;
  gap: 0.8rem;
  color: var(--color-accent-deep);
}
.screen-title :is(h1, h2),
.screen-shell .screen-surface .screen-title :is(h1, h2) {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin: 0;
  color: inherit;
  font-family: var(--font-reading);
  font-size: 1.25rem;
  font-style: normal;
  font-weight: 500;
}
.screen-title :is(h1, h2)::before,
.screen-title :is(h1, h2)::after {
  content: "";
  width: 1.35rem;
  border-top: 1px solid var(--color-divider);
}
.screen-title + .screen-muted,
.screen-title + .screen-note {
  flex: 1 1 100%;
  margin: 0.15rem 0 0;
  text-align: center;
}

/* Toolbar above a list: the filter pills on one side, the search field on the
   other. Shared by Nhật ký (sidebar), "Chi phí theo mô hình" and the usage
   chart header. The bottom margin is a list-toolbar delta only. */
.screen-filter-row,
.usage-chart-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.screen-filter-row {
  margin-block-end: 1rem;
}
.screen-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
}
/* Sort chips reuse the fold-h3 lighter: terra mark + text, darker on hover/pressed.
   Usage token/lượt toggle keeps its own segmented look below. */
.screen-filters .screen-button {
  display: inline-flex;
  align-items: center;
  gap: 0.28rem;
  min-height: 0;
  padding: 0.15rem 0.2rem;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--chat-brand-accent);
  font-size: 1.15rem;
  transition: color var(--dur-short) var(--ease-out);
}
.screen-filters .screen-button::before {
  content: "";
  flex: 0 0 0.28rem;
  width: 0.28rem;
  height: 1.15rem;
  border-radius: 99px;
  background: var(--chat-brand-accent);
  box-shadow: 0 0 0.35rem color-mix(in oklab, var(--chat-brand-accent) 35%, transparent);
  transition: background var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
}
.screen-filters .screen-button[aria-pressed='true'] {
  color: color-mix(in oklab, var(--chat-brand-accent) 35%, var(--color-ink));
  background: transparent;
}
.screen-filters .screen-button[aria-pressed='true']::before {
  background: color-mix(in oklab, var(--chat-brand-accent) 35%, var(--color-ink));
  box-shadow: 0 0 0.4rem color-mix(in oklab, var(--chat-brand-accent) 50%, transparent);
}
@media (hover: hover) and (pointer: fine) {
  .screen-filters .screen-button:not(:disabled):hover {
    border-color: transparent;
    color: color-mix(in oklab, var(--chat-brand-accent) 35%, var(--color-ink));
    background: transparent;
  }
  .screen-filters .screen-button:not(:disabled):hover::before {
    background: color-mix(in oklab, var(--chat-brand-accent) 35%, var(--color-ink));
    box-shadow: 0 0 0.4rem color-mix(in oklab, var(--chat-brand-accent) 50%, transparent);
  }
}
.usage-toggle button[aria-pressed='true'] {
  background: color-mix(in oklab, var(--color-accent-soft) 60%, var(--color-paper-card));
}
/* Shared search · fill-cream C. Every screen uses .thyca-search; page files
   only place the widget and (rarely) --sm/--lg. Tokens stay local so they
   do not fight the notebook :root. */
.thyca-search {
  --ink: #3d2a1f;
  --terra: #a65a42;
  --fill: var(--color-paper-input);
  --border: rgba(61, 42, 31, 0.18);
  --border-strong: rgba(166, 90, 66, 0.35);
  --muted: rgba(61, 42, 31, 0.52);
  --search-h: 40px;
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  min-width: 0;
  min-height: var(--search-h);
  padding: 0 12px 0 14px;
  gap: 10px;
  background: var(--fill);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.55) inset,
    0 1px 2px rgba(61, 42, 31, 0.04);
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.thyca-search:hover {
  border-color: rgba(61, 42, 31, 0.2);
  background: color-mix(in srgb, var(--color-bg-surface) 70%, var(--color-bg-frame));
}
.thyca-search:focus-within {
  border-color: var(--border-strong);
  background: var(--color-bg-surface);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.8) inset,
    0 0 0 3px rgba(166, 90, 66, 0.12),
    0 2px 6px rgba(61, 42, 31, 0.06);
}
.thyca-search__icon {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  color: var(--muted);
  display: block;
}
.thyca-search:focus-within .thyca-search__icon { color: var(--terra); }
.thyca-search__input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  outline: none;
  box-shadow: none;
  background: transparent;
  font: inherit;
  font-size: 14px;
  line-height: 1.3;
  color: var(--ink);
  padding: 10px 0;
  caret-color: var(--terra);
}
.thyca-search__input:focus,
.thyca-search__input:focus-visible {
  outline: none;
  box-shadow: none;
}
.thyca-search__input::placeholder {
  color: var(--muted);
  opacity: 1;
}
.thyca-search__input::-webkit-search-cancel-button,
.thyca-search__input::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
}
.thyca-search__clear {
  flex: 0 0 auto;
  width: 0;
  height: 22px;
  border-radius: 50%;
  border: 0;
  padding: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: transparent;
  color: var(--muted);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease, width 0.12s ease, background 0.12s ease, color 0.12s ease;
}
.thyca-search.is-filled .thyca-search__clear {
  width: 22px;
  opacity: 1;
  pointer-events: auto;
}
.thyca-search__clear:hover {
  background: rgba(61, 42, 31, 0.08);
  color: var(--ink);
}
.thyca-search__clear svg {
  width: 12px;
  height: 12px;
  display: block;
}
.thyca-search--sm { --search-h: 34px; padding: 0 10px 0 12px; gap: 8px; }
.thyca-search--sm .thyca-search__input { font-size: 13px; padding: 7px 0; }
.thyca-search--sm .thyca-search__icon { width: 14px; height: 14px; }
.screen-filter-row .thyca-search {
  width: min(20rem, 100%);
  flex: 0 1 20rem;
}

/* Quiet ⋮ action: row actions on cards, and the header action on Hồ sơ. */
.row-action {
  align-self: center;
  width: 1.35rem;
  height: 1.85rem;
  padding: 0;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--color-accent-deep);
  font-size: 1.25rem;
  letter-spacing: 0;
}

.screen-icon { flex: 0 0 auto; width: 1.4rem; height: 1.4rem; }

.screen-card {
  min-width: 0;
  padding: var(--space-lg);
  border: var(--rule) solid var(--color-border);
  border-radius: var(--radius-chat);
  background: var(--chat-brand-wash);
  box-shadow: none;
}
.screen-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: 0.2rem 0.65rem;
  border: var(--rule) solid var(--color-border);
  border-radius: var(--radius-xs);
  background: var(--chat-brand-wash);
  color: var(--color-accent-deep);
  font-size: 0.875rem;
  white-space: nowrap;
}

/* Journal kit · shared, opt-in via the Dashboard/Trace shells only. One row
   per entry: tabular date in the left gutter, terracotta dash on the body,
   hairline rule between entries. Memories keeps its own .memory-* rules; page
   files (dashboard.css, trace.css) add placement deltas on top. */
:is(.dashboard-shell, .trace-shell) {
  /* Muted error red for the kit, scoped here so the global root palette is
     untouched; terracotta (--chat-brand-accent / --color-accent-deep) stays
     reserved for the dash and section marks. */
  --journal-error-ink: oklch(48% 0.11 25);
}
:is(.dashboard-shell, .trace-shell) .journal-entry {
  list-style: none;
}
:is(.dashboard-shell, .trace-shell) .journal-entry {
  display: grid;
  grid-template-columns: 5.6rem minmax(0, 1fr);
  column-gap: 1.4rem;
  align-items: start;
  padding: 1.05rem 0;
  border-block-end: var(--rule) solid var(--color-divider);
}
:is(.dashboard-shell, .trace-shell) .journal-date {
  padding-top: 0.2rem;
  color: var(--color-muted);
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
:is(.dashboard-shell, .trace-shell) .journal-body {
  position: relative;
  min-width: 0;
  padding-inline-start: 1.4rem;
}
:is(.dashboard-shell, .trace-shell) .journal-body::before {
  content: "—";
  position: absolute;
  inset-inline-start: 0;
  color: var(--chat-brand-accent);
}
:is(.dashboard-shell, .trace-shell) .journal-body h3 {
  margin: 0;
  color: var(--color-ink);
  overflow-wrap: anywhere;
}
:is(.dashboard-shell, .trace-shell) .journal-body h3 a {
  color: inherit;
  text-decoration: none;
}
@media (hover: hover) and (pointer: fine) {
  :is(.dashboard-shell, .trace-shell) .journal-body h3 a:hover {
    text-decoration: underline;
    text-underline-offset: 0.2em;
  }
}
:is(.dashboard-shell, .trace-shell) .journal-status {
  margin-inline-start: 0.6rem;
  color: var(--color-success-ink);
  font-size: 0.78rem;
  font-weight: 400;
  white-space: nowrap;
}
:is(.dashboard-shell, .trace-shell) .journal-status.is-error {
  color: var(--journal-error-ink);
}
:is(.dashboard-shell, .trace-shell) .journal-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem 1rem;
  margin-block-start: 0.3rem;
  color: var(--color-muted);
  font-size: 0.83rem;
}
:is(.dashboard-shell, .trace-shell) .journal-meta > * + *::before {
  content: "\00b7";
  margin-inline-end: 1rem;
  color: var(--color-muted-soft);
}
:is(.dashboard-shell, .trace-shell) .journal-value {
  display: block;
  margin-block-start: 0.1rem;
  color: var(--color-ink);
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 500;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
}
:is(.dashboard-shell, .trace-shell) .journal-row-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
}
:is(.dashboard-shell, .trace-shell) .journal-amount {
  color: var(--color-ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
:is(.dashboard-shell, .trace-shell) .journal-meter {
  height: 3px;
  margin: 0.75rem 0;
  background: color-mix(in oklab, var(--color-divider) 70%, transparent);
}
:is(.dashboard-shell, .trace-shell) .journal-meter > span {
  display: block;
  height: 100%;
  width: var(--share, 0%);
  background: var(--chat-brand-accent);
}
@media (max-width: 56rem) {
  :is(.dashboard-shell, .trace-shell) .journal-entry {
    grid-template-columns: minmax(0, 1fr);
    row-gap: 0.15rem;
  }
  :is(.dashboard-shell, .trace-shell) .journal-date {
    padding-inline-start: 1.4rem;
  }
  :is(.dashboard-shell, .trace-shell) .journal-row-title {
    flex-wrap: wrap;
  }
}

/* Fold section kit · section headers that collapse/expand their content:
   details.fold-section > summary > :is(h2, h3), content after the summary. The
   terracotta lighter mark lives on the heading, so every screen (trace,
   Cài đặt, Nhật ký mobile) keeps one shared look and behaviour.
   Open by default — click the heading to collapse. */
.fold-section > summary {
  cursor: pointer;
  list-style: none;
  margin: -0.35rem -0.7rem;
  padding: 0.35rem 0.7rem;
}
.fold-section > summary:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 3px;
}
.fold-section > summary::-webkit-details-marker,
.fold-section > summary::marker {
  display: none;
  content: "";
}
.fold-section > summary :is(h2, h3) {
  display: flex;
  align-items: center;
  gap: 0.28rem;
  margin: 0;
  color: var(--chat-brand-accent);
  transition: color var(--dur-short) var(--ease-out);
}
.fold-section > summary :is(h2, h3)::before {
  content: "";
  flex: 0 0 0.28rem;
  width: 0.28rem;
  height: 1.15rem;
  border-radius: 99px;
  background: var(--chat-brand-accent);
  box-shadow: 0 0 0.35rem color-mix(in oklab, var(--chat-brand-accent) 35%, transparent);
  transition: background var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .fold-section > summary:hover :is(h2, h3) {
    color: color-mix(in oklab, var(--chat-brand-accent) 35%, var(--color-ink));
  }
  .fold-section > summary:hover :is(h2, h3)::before {
    background: color-mix(in oklab, var(--chat-brand-accent) 35%, var(--color-ink));
    box-shadow: 0 0 0.4rem color-mix(in oklab, var(--chat-brand-accent) 50%, transparent);
  }
}
.fold-section[open] > summary :is(h2, h3) {
  margin: 0 0 0.7rem;
}

/* Settings card rows: provider.html / settings.html render each setting as an
   article.fold-row inside .fold-list, separated by a hairline rule. (The old
   collapsible summary kit — .fold-row > summary, .fold-row--plain and the
   .fold-row-*/.call-* sub-elements — is gone: no page renders summaries.) */
.screen-card.fold-list,
.fold-list {
  padding: 0;
  overflow: hidden;
}
.fold-row {
  border-block-end: 1px solid var(--color-border);
}
.fold-row:last-child {
  border: 0;
}

.screen-button, .screen-select, .screen-input {
  min-height: 2.75rem;
  max-width: 100%;
  padding: 0.65rem 1rem;
  border: var(--rule) solid var(--color-divider);
  border-radius: var(--radius-sm);
  background: var(--color-paper-card);
  color: var(--color-ink);
  font: inherit;
}
.screen-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  text-decoration: none;
  white-space: nowrap;
}
.screen-button.is-primary {
  border-color: var(--color-accent);
  background: var(--color-accent);
  color: var(--color-accent-ink);
}
.screen-input { width: 100%; min-width: 0; }
.screen-select { cursor: pointer; }
.screen-button:disabled {
  cursor: not-allowed;
  color: var(--color-muted);
  opacity: 0.65;
}

.screen-nav { display: grid; gap: var(--space-xs); padding: 1.4rem 1.6rem; }
.screen-nav-entry { display: grid; gap: var(--space-xs); }
.memory-scope-submenu { display: grid; gap: var(--space-xs); padding-inline-start: 1.35rem; }
.memory-scope-submenu[hidden] { display: none; }
.screen-nav .memory-scope-submenu .memory-scope-choice {
  min-height: 3rem;
  padding-inline-start: 1.25rem;
  white-space: normal;
}
.screen-nav .memory-scope-submenu .memory-scope-state {
  margin: 0;
  padding: 0.45rem 1rem;
  color: var(--color-muted);
  font-size: 0.875rem;
  white-space: normal;
}
.screen-nav .memory-scope-submenu .memory-scope-state.is-error { color: var(--color-accent-deep); }
@media (max-width: 56rem) {
  .screen-nav .memory-navigation-entry > a::after {
    content: "⌄";
    margin-inline-start: auto;
    color: var(--color-muted);
    transition: transform var(--dur-short) var(--ease-out);
  }
  .screen-nav .memory-navigation-entry > a[aria-expanded="true"]::after { transform: rotate(180deg); }
}
.screen-nav a, .screen-nav button {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  min-height: 3.6rem;
  padding: 0.75rem 1rem;
  border: var(--rule) solid transparent;
  border-radius: 0;
  background: transparent;
  color: var(--color-ink);
  text-align: start;
  text-decoration: none;
  white-space: nowrap;
}
.screen-nav [aria-current="page"], .screen-nav [aria-selected="true"] {
  border-radius: var(--radius-sm);
  background: var(--color-accent);
  color: var(--color-accent-ink);
}
.screen-nav svg { width: 1.45rem; height: 1.45rem; flex: 0 0 auto; }
.screen-dialog {
  width: min(32rem, calc(100vw - 2rem));
  height: fit-content;
  max-height: calc(100dvh - 2rem);
  margin: auto;
  padding: var(--space-lg);
  overflow: auto;
  border: var(--rule) solid var(--color-divider);
  border-radius: var(--radius-chat);
  background-color: var(--color-paper);
  background-image:
    linear-gradient(color-mix(in oklab, var(--color-paper-chat) 65%, transparent), color-mix(in oklab, var(--color-paper-chat) 65%, transparent)),
    url("images/thyca-bg-paper.png");
  background-position: center;
  background-size: cover;
  color: var(--color-reading);
  font-family: var(--font-reading);
  box-shadow: 0 1rem 3rem var(--color-shell-shadow-soft);
}
.screen-dialog::backdrop { background: var(--color-shell-shadow); }
.screen-dialog h2 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; }
.screen-dialog .screen-nav { padding: 0; }
.screen-dialog .screen-heading { margin-block-end: 1rem; }
.screen-dialog form { display: grid; gap: var(--space-md); }
.screen-dialog label { display: grid; gap: var(--space-xs); }
.screen-dialog textarea { min-height: 6rem; resize: vertical; }
.screen-dialog .screen-toolbar { justify-content: flex-end; margin: 0; }

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 3px;
}
@media (hover: hover) and (pointer: fine) {
  .screen-button:not(:disabled):hover { border-color: var(--color-accent); }
  .screen-button.is-primary:not(:disabled):hover {
    border-color: var(--color-accent-deep);
    background: var(--color-accent-deep);
  }
  .screen-nav :is(a, button):not([aria-current="page"]):not([aria-selected="true"]):not(:disabled):hover {
    border-color: var(--color-divider);
    background: var(--color-paper-card);
  }
}

/* Compact journal pagers (TASK-034): one restrained row of text controls
   shared by the Dashboard/Trace journals (.journal-pager) and the chat
   session list (.session-pager). The buttons keep the .screen-button hook
   from the markup, but the card look (paper background, hairline box,
   radius, shadow) is reset inside the pager only — what remains is
   terracotta serif text, underline on hover, a 44px touch box and the
   global focus-visible ring. No decorative counters; the plain x/y label
   stays modest and tabular. Rows wrap instead of overflowing on narrow
   screens; nothing hides overflow here. */
:is(.dashboard-shell, .trace-shell) .journal-pager,
.session-pager {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.25rem 0.9rem;
}

:is(.dashboard-shell, .trace-shell) .journal-pager .journal-pager-step,
.session-pager .session-pager-step {
  appearance: none;
  min-height: 2.75rem; /* 44px touch target, as .screen-button */
  min-width: 0;
  margin: 0;
  padding: 0.25rem 0.4rem;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
  color: var(--color-accent-deep);
  font: inherit;
  white-space: nowrap;
  text-decoration: none;
  text-underline-offset: 0.22em;
  cursor: pointer;
}

@media (hover: hover) and (pointer: fine) {
  :is(.dashboard-shell, .trace-shell) .journal-pager .journal-pager-step:not(:disabled):hover,
  .session-pager .session-pager-step:not(:disabled):hover {
    color: var(--color-ink);
    text-decoration: underline;
  }
}

:is(.dashboard-shell, .trace-shell) .journal-pager .journal-pager-step:not(:disabled):active,
.session-pager .session-pager-step:not(:disabled):active {
  color: var(--color-ink);
  text-decoration: underline;
  text-decoration-thickness: 2px;
}

:is(.dashboard-shell, .trace-shell) .journal-pager .journal-pager-step:disabled,
.session-pager .session-pager-step:disabled {
  color: var(--color-muted-soft);
  opacity: 0.6;
  text-decoration: none;
  cursor: not-allowed;
}

:is(.dashboard-shell, .trace-shell) .journal-pager .journal-pager-label,
.session-pager .session-pager-label {
  min-width: 3.25rem;
  color: var(--color-muted);
  font-size: 0.875rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

:is(.dashboard-shell, .trace-shell) .journal-pager {
  margin-block-start: 1rem;
}
@media (max-width: 56rem) {
  .screen-shell { max-height: none; }
  /* The screens' file switcher stays reachable on mobile — an in-flow compact
     pill row under the header for the three screens that opted in
     (dashboard stacks its sections on one page instead — see dashboard.css).
     The overlay sidebar this replaces used to overlap the
     header line and the content below. */
  .screen-shell .sidebar {
    position: static;
    height: auto;
    flex: none;
    margin: 0;
    pointer-events: auto;
  }
  .memories-shell .sessions {
    display: flex !important;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.2rem 0.9rem;
    padding: 0.1rem 1rem 0.45rem;
    pointer-events: auto;
  }
  .screen-shell .sidebar > * { display: none; }
  .screen-shell .sessions-heading { padding-inline-end: 0; flex: none; }
  .screen-shell .sessions-heading h2 { font-size: 0.95rem; white-space: nowrap; }
  .screen-shell .session-list {
    flex: 1 1 100%;
    flex-direction: row;
    margin-block-start: 0;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 0.3rem;
    scrollbar-width: none;
  }
  .screen-shell .session-item {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    min-height: 0;
    padding: 0.28rem 0.7rem;
    border: var(--rule) solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-paper-card);
  }
  .screen-shell .session-item::before,
  .screen-shell .session-item::after { content: none; }
  .screen-shell .session-item.is-active {
    border-color: var(--color-accent);
    background: var(--color-bg-selected);
  }
  .screen-shell .session-icon { width: 1.1rem; height: 1.1rem; margin: 0; }
  .screen-shell .session-item time { display: none; }
  .screen-filter-row { align-items: stretch; flex-direction: column; }
  /* Column direction turns the row's flex-basis into height: without this
     reset the search box renders 20rem tall on mobile (memories search is
     exempt — it never sits in a filter row). */
  .screen-shell .screen-filter-row .thyca-search { flex: none; width: 100%; }
  .screen-surface { margin: 0; padding: 1rem; border-inline: 0; border-block-end: 0; border-radius: 0; }
  .screen-card { padding: 1rem; }
  /* Trace, Cài đặt, Hồ sơ: pick from the list first, then show the paper. */
  .pick-shell.is-picking .workspace { display: none; }
  .pick-shell:not(.is-picking) .sidebar { display: none; }
  .pick-shell.is-picking .sidebar {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    pointer-events: auto;
  }
  .pick-shell.is-picking .sessions {
    display: flex !important;
    flex-direction: column;
    padding: 0.85rem 1rem 1.25rem;
    pointer-events: auto;
  }
  .pick-shell.is-picking .sessions-heading h2 { font-size: 1.15rem; }
  .pick-shell.is-picking .session-list {
    flex: 1;
    flex-direction: column;
    margin-block-start: 1rem;
    overflow-x: hidden;
    overflow-y: auto;
    gap: 0.35rem;
  }
  .pick-shell.is-picking .session-item {
    display: grid;
    grid-template-columns: 1.85rem minmax(0, 1fr);
    min-height: 3.65rem;
    padding: 0.4rem 0.85rem 0.4rem 0.55rem;
    border: var(--rule) solid transparent;
    border-block-start-color: var(--color-divider);
    border-radius: 0;
    background: transparent;
  }
  .pick-shell.is-picking .session-item time { display: block; }
  .pick-shell.is-picking .session-item.is-active::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0.2rem 0.15rem;
    border-radius: 50%;
    background: var(--color-bg-selected);
    filter: blur(10px);
    pointer-events: none;
  }
  .pick-shell.is-picking .session-item.is-active::after {
    content: "";
    position: absolute;
    inset-block: 0.55rem;
    inset-inline-start: 0;
    width: 4px;
    border-radius: 99px;
    background: var(--chat-brand-accent);
  }
  .pick-shell:not(.is-picking) .screen-back {
    display: inline-flex;
    align-items: center;
    flex: none;
    padding: 0.2rem 0.4rem 0.2rem 0;
    border: 0;
    background: transparent;
    color: var(--chat-brand-accent);
    font: inherit;
    font-size: 1rem;
    cursor: pointer;
  }
}
@media (max-width: 28rem) {
  .screen-heading { align-items: stretch; flex-direction: column; }
  .screen-shell h2 { font-size: 1.45rem; overflow-wrap: anywhere; }
  .screen-select { width: 100%; }
}


/* App shell restored from pages/chat/chat.css (merge fix): these rules
   (.notebook-shell grid, site-header, sidebar, session list, workspace,
   icon-button, responsive shell overrides, reduced-motion) apply to EVERY
   page. W6 TASK-007 misfiled them as chat-only, breaking dashboard and
   other pages (unstyled shell). Moved verbatim; order within file kept. */
.notebook-shell {
  position: relative;
  z-index: var(--z-paper);
  display: grid;
  grid-template-columns: 20.25rem minmax(0, 1fr);
  grid-template-rows: 2.75rem minmax(0, 1fr) auto;
  width: 100%;
  height: calc(100dvh - 2.3rem);
  min-height: 43rem;
  max-height: 58.875rem;
  overflow: hidden;
  border-radius: var(--radius-shell);
  background-color: var(--color-paper);
  background-image:
    linear-gradient(color-mix(in oklab, var(--color-paper-chat) 65%, transparent), color-mix(in oklab, var(--color-paper-chat) 65%, transparent)),
    url("images/thyca-bg-paper.png");
  background-position: center;
  background-size: cover;
  box-shadow:
    0 0.72rem 0 var(--color-paper-edge),
    0 2.05rem 2.3rem var(--color-shell-shadow),
    0.65rem 0.8rem 1.2rem var(--color-shell-shadow-soft);
}

/* Tall screens (F11 fullscreen on 1080p+, 3K at 100%): the 58.875rem cap
   would leave a desk gap below the composer, so lift it and let the shell
   fill the viewport. Shorter screens keep the cap. */
@media (min-height: 60rem) {
  .notebook-shell {
    max-height: none;
  }
}

/* One continuous paper layer across the whole shell — header, frame,
   gutters, sidebar and workspace all sit on the same background. */
.notebook-shell::before {
  content: "";
  position: absolute;
  z-index: var(--z-base);
  inset: 0;
  border-radius: var(--radius-shell);
  background-color: var(--color-paper-chat);
  background-image:
    linear-gradient(color-mix(in oklab, var(--color-paper-chat) 65%, transparent), color-mix(in oklab, var(--color-paper-chat) 65%, transparent)),
    url("images/thyca-bg-paper.png");
  background-position: center;
  background-size: cover;
  pointer-events: none;
}

.site-header {
  position: relative;
  z-index: var(--z-content);
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: center;
  min-width: 0;
  padding-inline: 1.55rem 1.85rem;
  border-radius: var(--radius-shell) var(--radius-shell) 0 0;
  background: transparent;
}

.header-line {
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 0.7rem;
  width: max-content;
  max-width: 100%;
  margin: 0 0 0 auto;
  min-height: 1.15rem;
  padding: 0 0.2rem 0.12rem;
  overflow: hidden;
  border-bottom: var(--rule) solid var(--color-divider);
  color: var(--color-muted);
  font-family: var(--font-reading);
  font-size: 0.88rem;
  font-style: italic;
  line-height: 1.15;
  white-space: nowrap;
}

#header-edition {
  font-size: 0.72rem;
}

.sidebar {
  position: relative;
  z-index: var(--z-content);
  grid-column: 1;
  grid-row: 2 / -1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  margin: 0 0.18rem 1.25rem 1.25rem;
  overflow: hidden;
  border: var(--rule) solid var(--color-border);
  border-radius: var(--radius-chat);
  background: transparent;
  box-shadow: 0 0.55rem 1.35rem var(--color-shell-shadow-soft);
}

.icon-button,
.new-session {
  display: inline-grid;
  place-items: center;
  padding: 0;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--color-muted);
  transition: color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}

.icon-button {
  width: 2.75rem;
  height: 2.75rem;
}

.icon-button svg {
  width: 1.65rem;
  height: 1.65rem;
  stroke-width: 1.75;
}

.sessions {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  padding: 1.95rem 0.65rem 1rem 1.55rem;
  font-family: var(--font-ui);
}

.sessions-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  padding-inline-end: 0.65rem;
}

.sessions-heading h2 {
  margin: 0;
  color: var(--chat-brand-ink);
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-style: normal;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.2;
}

.new-session {
  width: 2.5rem;
  height: 2.35rem;
  border: var(--rule) solid var(--color-divider);
}

.new-session svg {
  width: 1.1rem;
  height: 1.1rem;
  stroke-width: 1.7;
}

/* One thin, faint scrollbar for the chat sidebar, the conversation pane, and
   the screen surfaces (kit.css never re-sets these). */
.session-list,
.conversation-scroll,
.screen-surface {
  scrollbar-width: thin;
  scrollbar-color: var(--color-divider) transparent;
}

.session-list {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  min-height: 0;
  margin-block-start: 1.5rem;
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* The row is the positioning context for its hover actions: the button keeps
   its own layout, the actions are laid over the right end of it. */
.session-row {
  position: relative;
}

.session-item {
  position: relative;
  display: grid;
  grid-template-columns: 1.85rem minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.08rem;
  min-height: 3.65rem;
  padding: 0.4rem 0.85rem 0.4rem 0.55rem;
  isolation: isolate;
  border: var(--rule) solid transparent;
  border-block-start-color: var(--color-divider);
  border-radius: 0;
  background: transparent;
  color: var(--chat-brand-accent);
  text-align: start;
  text-decoration: none;
  transition: color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}

/* The first row of the list carries no rule above it. Chat rows are wrapped
   in .session-row to hold their hover actions; every other screen puts the
   .session-item straight into the list. */
.session-list > .session-row:first-child .session-item,
.session-list > .session-item:first-child {
  border-block-start: 0;
}

.session-row .session-item {
  width: 100%;
}

.session-item.is-active::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0.2rem 0.15rem;
  border-radius: 50%;
  background: var(--color-bg-selected);
  filter: blur(10px);
  pointer-events: none;
}

.session-item.is-active::after {
  content: "";
  position: absolute;
  z-index: 0;
  inset-block: 0.55rem;
  inset-inline-start: 0;
  width: 4px;
  border-radius: 99px;
  background: var(--chat-brand-accent);
}

.session-icon {
  grid-column: 1;
  grid-row: 1;
  width: 1.85rem;

  z-index: 1;

  inset-inline-end: 0.55rem;

  gap: 0.45rem 0.75rem;
}

.field-grid label {
  color: var(--color-ink);
  font-size: 0.88rem;
}

.info-dot {
  margin-left: 0.25rem;
  color: var(--color-muted);
  font-size: 0.8rem;
  cursor: help;
}

/* Context + prices share one compact row under the model detail: narrow
   context field beside the price trio. Units fold into the labels. */
.mini-quad {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr));
  align-items: start;
  gap: 0.5rem 0.75rem;
  margin-top: 0.6rem;
  /* Line up with the input column above (mirrors .field-grid metrics). */
  margin-left: calc(8.5rem + 0.75rem);
}

.mini-quad label {
  color: var(--color-muted);
  font-size: 0.8rem;
}

.mini-quad .screen-input {
  width: 100%;
}

.mini-quad > div {
  display: grid;
  align-content: start;
  gap: 0.25rem;
  min-width: 0;
}


/* Field-level errors: the offending input gets the ring + focus. */
.provider-shell .screen-input[aria-invalid="true"],
.provider-shell .screen-select[aria-invalid="true"] {
  border-color: var(--color-accent-deep);
  box-shadow: 0 0 0 2px color-mix(in oklab, var(--color-accent-deep) 18%, transparent);
}

/* Giới hạn chung keeps fold rows, but compact and rule-free like the rest. */
.provider-shell .fold-row {
  border: 0;
}

.provider-shell .settings-row {
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  padding: 0.45rem 0;
}

.provider-shell .settings-row h3 {
  font-size: 0.92rem;
}

.provider-shell .fold-section > summary :is(h2, h3) {
  font-size: 1.05rem;
}


/* Routine info stays a quiet line; only success/error get the nudge card. */
.provider-nudge:not(.is-error):not(.is-success) {
  padding: 0.2rem 0.1rem;
  border-color: transparent;
  background: transparent;
  box-shadow: none;
  color: var(--color-muted);
  font-size: 0.85rem;
}

.provider-shell .provider-actions {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--color-border);
}

@media (max-width: 56rem) {
  .provider-shell .provider-actions {
    flex-wrap: wrap;
    overflow: visible;
  }
}

@media (max-width: 48rem) {
  .provider-columns {
    grid-template-columns: minmax(0, 1fr);
  }

  .field-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 0.25rem;
  }

  .mini-quad {
    grid-template-columns: minmax(0, 1fr);
  }

  .mini-quad {
    margin-left: 0;
  }
}

</style>
</head>
<body>
<main class="notebook-shell screen-shell settings-shell pick-shell provider-shell" aria-label="Provider Thyca">
  <header class="site-header">
        <button class="icon-button menu-button" type="button" aria-label="Mở mục lục">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h11" /></svg>
        </button>
    <p class="header-line">
      <time id="header-datetime" datetime="2026-10-21">21 tháng 10, 2026</time>
      <span id="header-edition">Thyca</span>
    </p>
  </header>
  <aside class="sidebar" aria-label="Điều hướng cài đặt">
    <section class="sessions">
      <div class="sessions-heading"><h2>Cài đặt</h2></div>
      <nav class="session-list" aria-label="Mục cài đặt">
        <a class="session-item" href="settings.html#chung"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Chung</span></a>
        <a class="session-item is-active" href="provider.html" aria-current="page"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Provider</span></a>
        <a class="session-item" href="settings.html#giao-dien"><span class="session-icon" aria-hidden="true"></span><span class="session-name">Giao diện</span></a>
      </nav>
    </section>
  </aside>
  <section class="workspace" aria-label="Nhà cung cấp và mô hình">
    <section class="screen-surface" aria-label="Provider và mô hình">
      <header class="screen-heading">
        <button class="screen-back" type="button">‹ Cài đặt</button>
        <div class="screen-title"><h1>Provider</h1></div>
        <p class="screen-muted">Mỗi provider key riêng, mỗi model gọi đúng provider của nó.</p>
      </header>
      <!-- GET /api/config → đổ toàn form; POST /api/config khi Lưu -->
      <form id="provider-form" class="screen-card" novalidate>
        <details class="provider-group fold-section" open aria-labelledby="provider-group-heading">
          <summary><h3 id="provider-group-heading">Nhà cung cấp</h3></summary>
          <div class="provider-columns">
            <div>
              <ul class="pick-list" id="provider-list" aria-label="Danh sách provider">
                <li class="pick-row is-active" data-id="openai">
                  <button type="button" class="pick-select" aria-current="true">
                    <span class="pick-name" title="openai">openai</span><span class="pick-badge">Mặc định</span>
                  </button>
                  <details class="pick-menu">
                    <summary class="icon-button" aria-label="Tùy chọn">⋮</summary>
                    <div class="pick-menu-pop" role="menu">
                      <button type="button" data-action="provider-default" data-id="openai">Đặt mặc định</button>
                      <button type="button" data-action="provider-rename" data-id="openai">Đổi tên</button>
                      <button type="button" class="is-danger" data-action="provider-delete" data-id="openai">Xóa</button>
                    </div>
                  </details>
                </li>
                <li class="pick-row" data-id="local">
                  <button type="button" class="pick-select">
                    <span class="pick-name" title="local">local</span>
                  </button>
                  <details class="pick-menu">
                    <summary class="icon-button" aria-label="Tùy chọn">⋮</summary>
                    <div class="pick-menu-pop" role="menu">
                      <button type="button" data-action="provider-default" data-id="local">Đặt mặc định</button>
                      <button type="button" data-action="provider-rename" data-id="local">Đổi tên</button>
                      <button type="button" class="is-danger" data-action="provider-delete" data-id="local">Xóa</button>
                    </div>
                  </details>
                </li>
              </ul>
              <button class="screen-button pick-add" id="provider-add" type="button">Thêm</button>
            </div>
            <div>
              <div class="detail-head">
                <h3 id="provider-detail-name">openai</h3>
                <span class="pick-badge" id="provider-detail-badge">Mặc định</span>
                <div class="detail-actions">
                  <button class="screen-button is-primary" id="provider-create" type="button" hidden>Tạo provider</button>
                  <button class="screen-button" id="provider-cancel" type="button" hidden>Hủy</button>
                </div>
              </div>
              <div class="field-grid">
                <label for="provider-name" id="provider-name-label" hidden>Tên</label>
                <input class="screen-input" id="provider-name" name="provider-name" autocomplete="off" spellcheck="false" maxlength="64" placeholder="vd: openai-2" hidden />
                <label for="provider-endpoint">Endpoint</label>
                <input class="screen-input" id="provider-endpoint" name="provider-endpoint" type="url" inputmode="url" autocomplete="off" spellcheck="false" value="https://api.openai.com/v1" />
                <label for="provider-key">Khóa API<span class="info-dot" title="Chỉ gửi về backend local khi kiểm tra hoặc lưu. Để trống để giữ khóa đã lưu.">ⓘ</span></label>
                <div>
                  <input type="text" name="provider-username" value="thyca-local" autocomplete="username" hidden tabindex="-1" aria-hidden="true" />
                  <input class="screen-input" id="provider-key" name="provider-key" type="password" autocomplete="new-password" maxlength="200" placeholder="Để trống để giữ khóa đã lưu" />
                </div>
                <label for="provider">Kiểu endpoint</label>
                <select class="screen-select" id="provider" name="provider"><option value="openai" selected>OpenAI</option><option value="openrouter">OpenRouter</option><option value="local">Local</option><option value="custom">OpenAI-compatible</option></select>
                <label for="provider-api">Kiểu API<span class="info-dot" title="Responses trả kèm thinking summaries để hiện suy nghĩ của model.">ⓘ</span></label>
                <select class="screen-select" id="provider-api" name="provider-api"><option value="openai_chat" selected>Chat completions</option><option value="openai_responses">Responses</option></select>
              </div>
              <div class="provider-verify-row">
                <!-- POST /api/onboarding/verify — verify key + tải list model -->
                <button class="screen-button is-primary" id="verify-provider" type="button">Kiểm tra &amp; tải model</button>
              </div>
            </div>
          </div>
        </details>
        <details class="provider-group fold-section" open aria-labelledby="model-group-heading">
          <summary><h3 id="model-group-heading">Mô hình <span id="model-provider-name">· openai</span></h3></summary>
          <div class="provider-columns">
            <div>
              <ul class="pick-list" id="model-listbox" aria-label="Model của provider">
                <li class="pick-row is-active" data-id="gpt-5">
                  <button type="button" class="pick-select">
                    <span class="pick-name" title="gpt-5">gpt-5</span>
                  </button>
                  <details class="pick-menu">
                    <summary class="icon-button" aria-label="Tùy chọn">⋮</summary>
                    <div class="pick-menu-pop" role="menu">
                      <button type="button" data-action="model-default" data-id="gpt-5">Đặt mặc định</button>
                      <button type="button" class="is-danger" data-action="model-delete" data-id="gpt-5">Xóa</button>
                    </div>
                  </details>
                </li>
                <li class="pick-row" data-id="gpt-5-mini">
                  <button type="button" class="pick-select">
                    <span class="pick-name" title="gpt-5-mini">gpt-5-mini</span>
                  </button>
                  <details class="pick-menu">
                    <summary class="icon-button" aria-label="Tùy chọn">⋮</summary>
                    <div class="pick-menu-pop" role="menu">
                      <button type="button" data-action="model-default" data-id="gpt-5-mini">Đặt mặc định</button>
                      <button type="button" class="is-danger" data-action="model-delete" data-id="gpt-5-mini">Xóa</button>
                    </div>
                  </details>
                </li>
              </ul>
              <button class="screen-button pick-add" id="model-add" type="button">Thêm</button>
            </div>
            <div>
              <div class="detail-head" id="model-add-head" hidden><h3>Model mới</h3></div>
              <div class="field-grid">
                <label for="model">Model ID</label>
                <div class="model-id-wrap">
                  <input class="screen-input" id="model" name="model" required autocomplete="off" spellcheck="false" value="gpt-5" />
                  <ul class="model-suggest" id="model-suggest" role="listbox" aria-label="Gợi ý model" hidden></ul>
                </div>
                <label for="reasoning-effort">Mức suy luận</label>
                <select class="screen-select" id="reasoning-effort" name="reasoning-effort">
                  <option>low</option><option selected>medium</option><option>high</option>
                </select>
                <label for="reasoning-custom" id="reasoning-custom-label" hidden>Tự đặt</label>
                <input class="screen-input" id="reasoning-custom" name="reasoning-custom" autocomplete="off" spellcheck="false" maxlength="120" placeholder="vd: low, high, xhigh" hidden />
              </div>
              <div class="mini-quad">
                <div>
                  <label for="context-window" title="Đơn vị: token">Ngữ cảnh</label>
                  <input class="screen-input" id="context-window" name="context-window" type="number" min="1000" max="2000000" step="1" value="400000" inputmode="numeric" />
                </div>
                <div>
                  <label for="input-cost" title="USD / 1M token">Input cost</label>
                  <input class="screen-input" id="input-cost" name="input-cost" type="number" min="0" step="any" value="1.25" />
                </div>
                <div>
                  <label for="cache-input-cost" title="USD / 1M token">Cache cost</label>
                  <input class="screen-input" id="cache-input-cost" name="cache-input-cost" type="number" min="0" step="any" value="0.125" />
                </div>
                <div>
                  <label for="output-cost" title="USD / 1M token">Output cost</label>
                  <input class="screen-input" id="output-cost" name="output-cost" type="number" min="0" step="any" value="10" />
                </div>
              </div>
              <div class="detail-actions" id="model-create-row" hidden>
                <button class="screen-button is-primary" id="model-create" type="button">Tạo model</button>
                <button class="screen-button" type="button" id="model-cancel">Hủy</button>
              </div>
            </div>
          </div>
        </details>
        <div class="provider-actions">
          <div class="thyca-nudge provider-nudge" id="provider-status" role="status" aria-live="polite"></div>
          <!-- POST /api/config — values toàn bộ providers/models -->
          <button class="screen-button is-primary" id="save-provider" type="submit">Lưu cấu hình</button>
          <button class="screen-button settings-reset" type="button">Hoàn tác thay đổi</button>
        </div>
      </form>
    </section>
  </section>
</main>
</body>
</html>

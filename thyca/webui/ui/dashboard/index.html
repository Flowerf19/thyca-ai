<!-- Dashboard "Sử dụng & chi phí" wired to the real backend — no sample data.
     Shell: ../share/shell.js emitShell('dashboard') builds header/sidebar/dialogs
     synchronously (must run before sidebar.js/studio.js bind DOM at load);
     bootShell() then fills the live roster. Page content lives in .workspace.
     API: GET /api/traces/stats?from&to                    — totals + by_model/by_bot/by_day/by_hour/by_status + models
          GET /api/traces?from&to&limit&offset&model&status — {traces, total}, newest first
          GET /api/bots, GET /api/sessions                 — via share/data.js inside bootShell()
          GET /api/traces/<session>/<turn>                 — opened by the trace page, not fetched here
     Deep-link convention (one form everywhere on this screen):
       turn row -> ../trace/index.html#<session_id>/<turn_index>
     The shared sidebar keeps its shell-app.js defaults: bot -> ../chat/index.html?bot=<id>,
     group/session -> ../chat/index.html?s=<id>. -->
